<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMALIA-AI — מחולל סאטירי</title><style>
*{box-sizing:border-box}body{margin:0;background:#151411;color:#f7f2e8;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:32px 20px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}.hero{border-radius:24px;overflow:hidden;background:#29251f;text-align:center}.hero img{display:block;width:100%;height:auto}.brand{direction:ltr;font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:-3px;line-height:.88;margin:12px 0 18px;color:#f0c45a}.tag{font-size:23px;font-weight:700;margin-bottom:26px}label{display:block;font-weight:bold;margin:18px 0 9px}textarea,select{width:100%;background:#24221e;color:#fff;border:1px solid #514a3c;border-radius:12px;padding:14px;font:inherit}textarea{resize:vertical;min-height:110px}input[type=range]{width:100%;accent-color:#efc35b}button{cursor:pointer;border:0;border-radius:12px;background:#efc35b;color:#151411;font:inherit;font-weight:800;padding:15px 22px}button.primary{width:100%;margin-top:22px;font-size:20px}button:disabled{opacity:.5}#result{white-space:pre-wrap;line-height:1.8;background:#24221e;border:1px solid #514a3c;border-radius:12px;padding:20px;margin:20px 0}.sub{color:#bdb3a1;font-size:13px;line-height:1.5}footer{text-align:center;color:#bdb3a1;font-size:12px;margin:30px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#332e24;color:#f5d17b;border:1px solid #514a3c}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:18px}.hero{max-height:330px}.hero img{height:330px;object-fit:cover;object-position:center 18%}main{padding:18px}.brand{font-size:clamp(36px,10vw,48px)}}
</style></head><body><main><div class="layout"><div class="panel"><div class="brand">AMALIA-AI<span style="color:#fff">.</span></div><p class="sub">מחולל סאטירי · מבוסס AI</p><div class="tag">מכניסים נושא. מקבלים כתב אישום.</div><form id="form"><label for="topic">על מה כותבים היום?</label><textarea id="topic" maxlength="1500" required placeholder="הכניסו נושא, אירוע או רעיון..."></textarea><label for="tone">מצב כתיבה</label><select id="tone"><option value="auto">בחירה אוטומטית</option><option value="sarcastic">סרקסטי</option><option value="angry">זועם ונוקב</option><option value="legal">משפטי ומנומק</option><option value="funny">קומי ומשועשע</option><option value="biblical">מקראי ודרמטי</option></select><label for="level">רמת הארסיות: <span id="num">8</span>/10</label><input type="range" id="level" min="1" max="10" value="8"><label for="length">אורך הפוסט</label><select id="length"><option value="short">ציוץ קצר</option><option value="medium" selected>בינוני</option><option value="long">ארוך</option></select><button class="primary" id="go">חולל פוסט ✦</button></form><div id="output" hidden><div id="result" aria-live="polite"></div><div class="actions"><button id="copy">העתקה</button><button id="share">שיתוף פוסט</button></div></div><p class="sub">הטקסט נוצר באמצעות AI ואינו ציטוט או פרסום אמיתי של עמליה.</p></div><div class="hero"><img src="/amalia/portrait.svg" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div hidden style="padding:80px 20px;font-size:80px">💛</div></div></div><footer>מחולל סאטירי לא רשמי · ללא שיוך או אישור מצד הדמות המוצגת</footer></main><script>
const $=id=>document.getElementById(id);$('level').oninput=()=>$('num').textContent=$('level').value;let post='';$('form').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;$('go').textContent='מחולל...';$('output').hidden=false;$('result').textContent='מנסח את הפוסט…';post='';try{const r=await fetch('/api/amalia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:$('topic').value,tone:$('tone').value,level:$('level').value,length:$('length').value})});const raw=await r.text();let d;try{d=JSON.parse(raw);}catch{throw Error('השרת החזיר תגובה לא תקינה (HTTP '+r.status+'). נסו שוב לאחר הפריסה.');}if(!r.ok)throw Error(d.error||'שגיאה');if(typeof d.post!=='string'||!d.post.trim())throw Error('לא התקבל פוסט.');post=d.post;$('result').textContent=post;}catch(e){$('result').textContent=e.message;}finally{$('go').disabled=false;$('go').textContent='חולל פוסט ✦';}};$('copy').onclick=async()=>{if(post){await navigator.clipboard.writeText(post);$('copy').textContent='הועתק!';}};$('share').onclick=async()=>{if(!post)return;const t=post+'\n(סאטירה שנוצרה ב-AMALIA-AI)';if(navigator.share){await navigator.share({text:t}).catch(()=>{});}else await navigator.clipboard.writeText(t);};</script></body></html>
